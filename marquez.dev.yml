server:
  applicationConnectors:
  - type: http
    port: ${MARQUEZ_PORT:-5000}
    httpCompliance: RFC7230_LEGACY
  adminConnectors:
  - type: http
    port: ${MARQUEZ_ADMIN_PORT:-5001}

db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/marquez
  user: marquez
  password: marquez
  # Set true to restore automatic DAO.method comments on SQL statements.
  autoCommentsEnabled: ${DB_AUTO_COMMENTS_ENABLED:-false}

migrateOnStartup: true

graphql:
  enabled: true

openLineage:
  workerThreads: ${OPEN_LINEAGE_WORKER_THREADS:-8}
  # Maximum events from one admitted batch projected per transaction (1-64); 1 retains singleton projection.
  projectionBatchSize: ${OPEN_LINEAGE_PROJECTION_BATCH_SIZE:-8}
  pollIntervalMillis: ${OPEN_LINEAGE_POLL_INTERVAL_MILLIS:-1000}
  # Maximum committed caught-failure count; the failure reaching this count is dead-lettered.
  maxAttempts: ${OPEN_LINEAGE_MAX_ATTEMPTS:-10}
  retryInitialDelayMillis: ${OPEN_LINEAGE_RETRY_INITIAL_DELAY_MILLIS:-1000}
  retryMaxDelayMillis: ${OPEN_LINEAGE_RETRY_MAX_DELAY_MILLIS:-60000}
  # Bounds each of the two executor waits. Synchronous JDBC abort between them has no application
  # deadline.
  shutdownGracePeriodMillis: ${OPEN_LINEAGE_SHUTDOWN_GRACE_PERIOD_MILLIS:-30000}

logging:
  level: INFO
  appenders:
    - type: console

search:
  enabled: ${SEARCH_ENABLED:-true}
  scheme: http
  host: ${SEARCH_HOST:-opensearch}
  port: ${SEARCH_PORT:-9200}
  username: admin
  password: admin

tags:
  - name: PII
    description: Personally identifiable information
  - name: SENSITIVE
    description: Contains sensitive information
