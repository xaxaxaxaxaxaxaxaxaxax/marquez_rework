          minLength: 1
          maxLength: 1024
        jobName:
          description: The job selector when the effective scope is `JOB`.
          type: string
          minLength: 1
          maxLength: 1024
        runId:
          description: The run selector when the effective scope is `RUN`.
          type: string
          format: uuid
        startAt:
          description: Inclusive effective range start, normalized to UTC.
          type: string
          format: date-time
        endAt:
          description: Exclusive effective range end, normalized to UTC.
          type: string
          format: date-time
        rollup:
          description: Canonical fixed elapsed-time ISO-8601 duration.
          type: string
          example: PT1H
        points:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/StatsPoint'

