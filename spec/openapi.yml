            $ref: '#/components/schemas/JobVersion'

    JobVersionId:
      type: object
      properties:
        namespace:
          type: string
          description: The namespace of the job.
        name:
          type: string
          description: The name of the job.
        version:
          type: string
          format: uuid
          description: The version of the job.

    JobVersion:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/JobVersionId'
        name:
          description: The name of the job.
          type: string
        version:
          description: The version of the job
          type: string
        createdAt:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the date/time the job version was created.
          type: string
          format: date-time
        namespace:
          description: The namespace of the job.
          type: string
        inputs:
          description: The set of **input** datasets
          type: array
          items:
            $ref: '#/components/schemas/DatasetId'
          uniqueItems: true
        outputs:
          description: The set of **output** datasets
          type: array
          items:
            $ref: '#/components/schemas/DatasetId'
          uniqueItems: true
        location:
          description: The URL of the job source code or artifact for the given job version.
          type: string
          format: URL
        context:
          description: Deprecated- Use facet. A key/value pair that must be of type `string`. A context can be used for getting additional details about the job.
          type: object
          deprecated: true
        latestRun:
          $ref: '#/components/schemas/Run'
        facets:
          $ref: '#/components/schemas/JobFacets'
      example:
        id:
          namespace: my-namespace
          name: my-job
          version: 56472c57-a2ef-4218-b7b7-d2af02a343fd
        type: BATCH
        name: my-job
        version: 56472c57-a2ef-4218-b7b7-d2af02a343fd
        createdAt: 2019-05-09T19:49:24.201361Z
        namespace: my-namespace
        inputs: [{namespace: my-namespace, name: my-dataset}]
        outputs: []
        location: https://github.com/my-jobs/blob/124f6089ad4c5fcbb1d7b33cbb5d3a9521c5d32c
        context: {'SQL': "SELECT * FROM mytable;"}
        description: My first job!
        facets: {}

    JobList:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        totalCount:
          type: number
          description: The total number of jobs for the given namespace

    CreatedRun:
      type: object
      properties:
        id:
          description: An _optional_ user-provided unique ID of the run. A run ID **must** be an [UUID](https://tools.ietf.org/html/rfc4122).
            If an ID for the run is not provided, a random UUID will be generated for the given run.
          type: string
          format: uuid
        nominalStartTime:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the nominal start time of the run.
          type: string
          format: date-time
        nominalEndTime:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the nominal end time of the run.
          type: string
          format: date-time
        args:
          description: The arguments of the run.
          type: object
      example:
        args: {'email': 'me@example.com', 'emailOnFailure': false, 'emailOnRetry': true, 'retries': 1}

    IncompleteRun:
      type: object
      properties:
        id:
          description: The ID of the run.
          type: string
          format: uuid
        createdAt:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the date/time the run was created.
          type: string
          format: date-time
        updatedAt:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the date/time the run was updated.
          type: string
          format: date-time
        nominalStartTime:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the nominal start time of the run.
          type: string
          format: date-time
        nominalEndTime:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the nominal end time of the run.
          type: string
          format: date-time
        state:
          description: The current state of the run.
          type: string
          enum: [NEW, RUNNING, COMPLETED, FAILED, ABORTED]
        startedAt:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the start time of the run.
          type: string
          format: date-time
        endedAt:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the end time of the run.
          type: string
          format: date-time
        durationMs:
          type: integer
          description: The total duration of the run. Measured in milliseconds.
        args:
          description: The arguments of the run.
          type: object
        facets:
          $ref: '#/components/schemas/RunFacets'
      example:
        id: 870492da-ecfb-4be0-91b9-9a89ddd3db90
        createdAt: 2019-05-09T19:49:24.201361Z
        updatedAt: 2019-05-09T19:49:24.201361Z
        nominalStartTime: null
        nominalEndTime: null
        state: RUNNING
        startedAt: 2019-05-09T15:17:32.690346
        endedAt: null
        durationMs: null
        args: {'email': 'me@example.com', 'emailOnFailure': 'false', 'emailOnRetry': 'true', 'retries': '1'}
        facets: {}

    Run:
      type: object
      anyOf:
        - $ref: '#/components/schemas/IncompleteRun'
        - type: object
          properties:
            jobVersion:
              $ref: '#/components/schemas/JobVersionId'
            inputDatasetVersions:
              type: array
              items:
                $ref: '#/components/schemas/InputDatasetVersion'
            outputDatasetVersions:
              type: array
              items:
                $ref: '#/components/schemas/OutputDatasetVersion'
            context:
              description: A key/value pair that must be of type `string`. A context can be used for getting additional details about the job.
              type: object
              deprecated: true
            facets:
              $ref: '#/components/schemas/RunFacets'
      example:
        id: 870492da-ecfb-4be0-91b9-9a89ddd3db90
        createdAt: 2019-05-09T19:49:24.201361Z
        updatedAt: 2019-05-09T19:49:24.201361Z
        nominalStartTime: null
        nominalEndTime: null
        state: COMPLETED
        startedAt: 2019-05-09T15:17:32.690346
        endedAt: 2019-05-09T20:05:46.815920Z
        durationMs: 4250894125
        args: {'email': 'me@example.com', 'emailOnFailure': 'false', 'emailOnRetry': 'true', 'retries': '1'}
        context: {'SQL': "SELECT * FROM mytable;"}
        facets: {}

    RunList:
      type: object
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/Run'

    DatasetFacets:
      description: The facets of the dataset. For a full list of standard dataset facets, see [OpenLineage](https://github.com/OpenLineage/OpenLineage/blob/main/spec/OpenLineage.md#standard-facets).
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CustomFacet'

    JobFacets:
      description: The facets of the job. For a full list of standard job facets, see [OpenLineage](https://github.com/OpenLineage/OpenLineage/blob/main/spec/OpenLineage.md#standard-facets).
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CustomFacet'

    RunFacets:
      description: The facets of the run. For a full list of standard run facets, see [OpenLineage](https://github.com/OpenLineage/OpenLineage/blob/main/spec/OpenLineage.md#standard-facets).
      type: object
      additionalProperties:
        $ref: '#/components/schemas/CustomFacet'

    CustomFacet:
      description: A custom facet enables the extension of _dataset_, _job_, and _run_ metadata. A custom facet **must** also have a schema,
        where a version of the schema is identifiable via a URL. A field within the schema **must** not start with an underscore (`_`).
      allOf:
        - $ref: '#/components/schemas/BaseFacet'
        - type: object
          additionalProperties: true

    BaseFacet:
      description: All base facet fields are prefixed with an underscore (`_`) to avoid field naming conflicts defined with other facets.
      type: object
      properties:
        _producer:
          description: URI identifying the producer of this metadata. For example this could be a git url with a given tag or sha
          type: string
          format: uri
          example: https://github.com/OpenLineage/OpenLineage/blob/v1-0-0/client
        _schemaURL:
          description: The URL to the corresponding version of the schema definition following a $ref URL Reference (see https://swagger.io/docs/specification/using-ref/)
          type: string
          format: uri
          example: https://github.com/OpenLineage/OpenLineage/blob/v1-0-0/spec/OpenLineage.yml#MyCustomJobFacet
      required:
        - _producer
        - _schemaURL

    LineageGraph:
      type: object
      properties:
        graph:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'

    GraphNode:
      type: object
      properties:
        id:
          type: string
          description: The ID of the node.
        type:
          $ref: '#/components/schemas/NodeType'
        data:
          type: object
          description: The data of the node.
          discriminator:
            propertyName: type
            mapping:
              'DATASET': '#/components/schemas/Dataset'
              'JOB': '#/components/schemas/Job'
          oneOf:
            - $ref: '#/components/schemas/Dataset'
            - $ref: '#/components/schemas/Job'
        inEdges:
          type: array
          description: The in edges of the node.
          items:
            $ref: '#/components/schemas/GraphEdge'
        outEdges:
          type: array
          description: The out edges of the node.
          items:
            $ref: '#/components/schemas/GraphEdge'

    NodeType:
      type: string
      enum: [ JOB, DATASET ]
      description: The type of the diff node.

    GraphEdge:
      type: object
      properties:
        origin:
          description: The ID of the origin node.
          type: string
        destination:
          description: The ID of the destination node.
          type: string

    CreatedTag:
      type: object
      properties:
        description:
          description: The description of the tag.
          type: string
      example:
        description: My first tag!

    UpstreamRunLineage:
      type: object
      properties:
        runs:
          description: the list of upstream runs including the selected run in topological order upstream
          type: array
          items:
            type: object
            propoerties:
              job:
                type: object
                description: identifier of the job version for this run
                propoerties:
                  namespace:
                    type: string
                  name:
                    type: string
                  version:
                    type: string
                    format: uuid
              run:
                description: run information
                type: object
                properties:
                  id:
                    description: the run identifier
                    type: string
                    format: uuid
                  start:
                    description: start time of the run
                    type: string
                    format: date-time
                  end:
                    description: end time of the run
                    type: string
                    format: date-time
                  status:
                    description: whether the run completed succesfully or not
                    type: string
              inputs:
                description: ustream input dataset versions
                type: array
                items:
                  description: identifier of the upstream dataset version consumed by this run
                  type: object
                  properties:
                    namespace:
                      type: string
                    name:
                      type: string
                    version:
                      type: string
                      format: uuid
                    producedByRunId:
                      description: the run that produced this dataset version
                      type: string
                      format: uuid

    OpenLineageEventRequest:
      description: >-
        A supported OpenLineage RunEvent, DatasetEvent, or JobEvent. The variants are selected by
        their documented shape and schema URL; no discriminator is used because a RunEvent may omit
        schemaURL for backward compatibility.
      oneOf:
        - $ref: '#/components/schemas/OpenLineageRunEventRequest'
        - $ref: '#/components/schemas/OpenLineageDatasetEventRequest'
        - $ref: '#/components/schemas/OpenLineageJobEventRequest'

    OpenLineageRunEventRequest:
      type: object
      additionalProperties: true
      required: [eventTime, run, job, producer]
      properties:
        eventType:
          type: string
        eventTime:
          type: string
          format: date-time
        run:
          $ref: '#/components/schemas/OpenLineageRunRequest'
        job:
          $ref: '#/components/schemas/OpenLineageJobRequest'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/OpenLineageDatasetRequest'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OpenLineageDatasetRequest'
        producer:
          type: string
        schemaURL:
          type: string
          format: uri
          nullable: true
          pattern: '/RunEvent$'
          description: May be omitted or null; the server then uses the RunEvent model.
      example:
        eventType: COMPLETE
        eventTime: 2019-05-09T19:49:24.201361Z
        run: {runId: d46e465b-d358-4d32-83d4-df660ff614dd}
        job: {namespace: my-namespace, name: my-job}
        outputs: [{namespace: my-namespace, name: my-output}]
        producer: https://example.com/openlineage-producer

    OpenLineageDatasetEventRequest:
      type: object
      additionalProperties: true
      required: [eventTime, dataset, producer, schemaURL]
      properties:
        eventTime:
          type: string
          format: date-time
        dataset:
          $ref: '#/components/schemas/OpenLineageDatasetRequest'
        producer:
          type: string
        schemaURL:
          type: string
          format: uri
          pattern: '/DatasetEvent$'
      example:
        eventTime: 2019-05-09T19:49:24.201361Z
        dataset: {namespace: my-namespace, name: my-dataset}
        producer: https://example.com/openlineage-producer
        schemaURL: https://openlineage.io/spec/2-0-0/OpenLineage.json#/definitions/DatasetEvent

    OpenLineageJobEventRequest:
      type: object
      additionalProperties: true
      required: [eventTime, job, producer, schemaURL]
      properties:
        eventTime:
          type: string
          format: date-time
        job:
          $ref: '#/components/schemas/OpenLineageJobRequest'
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/OpenLineageDatasetRequest'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OpenLineageDatasetRequest'
        producer:
          type: string
        schemaURL:
          type: string
          format: uri
          pattern: '/JobEvent$'
      example:
        eventTime: 2019-05-09T19:49:24.201361Z
        job: {namespace: my-namespace, name: my-job}
        producer: https://example.com/openlineage-producer
        schemaURL: https://openlineage.io/spec/2-0-0/OpenLineage.json#/definitions/JobEvent

    OpenLineageRunRequest:
      type: object
      additionalProperties: true
      required: [runId]
      properties:
        runId:
          $ref: '#/components/schemas/OpenLineageIdentityRequest'
        facets:
          $ref: '#/components/schemas/OpenLineageRunFacetsRequest'

    OpenLineageRunFacetsRequest:
      type: object
      additionalProperties: true
      properties:
        parent:
          $ref: '#/components/schemas/OpenLineageParentRunFacetRequest'
        parentRun:
          $ref: '#/components/schemas/OpenLineageParentRunFacetRequest'

    OpenLineageParentRunFacetRequest:
      type: object
      additionalProperties: true
      required: [_producer, _schemaURL, run, job]
      properties:
        _producer:
          type: string
          format: uri
        _schemaURL:
          type: string
          format: uri
        run:
          $ref: '#/components/schemas/OpenLineageRunLinkRequest'
        job:
          $ref: '#/components/schemas/OpenLineageJobRequest'

    OpenLineageRunLinkRequest:
      type: object
      additionalProperties: true
      required: [runId]
      properties:
        runId:
          $ref: '#/components/schemas/OpenLineageIdentityRequest'

    OpenLineageJobRequest:
      type: object
      additionalProperties: true
      required: [namespace, name]
      properties:
        namespace:
          $ref: '#/components/schemas/OpenLineageIdentityRequest'
        name:
          $ref: '#/components/schemas/OpenLineageIdentityRequest'
        facets:
          type: object
          additionalProperties: true

    OpenLineageDatasetRequest:
      type: object
      additionalProperties: true
      required: [namespace, name]
      properties:
        namespace:
          $ref: '#/components/schemas/OpenLineageIdentityRequest'
        name:
          $ref: '#/components/schemas/OpenLineageIdentityRequest'
        facets:
          type: object
          additionalProperties: true
        inputFacets:
          type: object
          additionalProperties: true
        outputFacets:
          type: object
          additionalProperties: true

    OpenLineageIdentityRequest:
      type: string
      minLength: 1
      description: >-
        An OpenLineage identity component. Runtime validation also rejects values made entirely of
        Java or Unicode separator whitespace, which OpenAPI 3.0 cannot express portably.

    LineageEvent:
      example:
        eventType: COMPLETE
        eventTime: 2019-05-09T19:49:24.201361Z
        run: {runId: d46e465b-d358-4d32-83d4-df660ff614dd}
        job: {namespace: my-namespace,name: my-job}
        outputs: [
          {
            namespace: my-namespace,
            name: my-output,
            facets: {
              schema: {
                _producer: "https://github.com/OpenLineage/OpenLineage/blob/v1-0-0/client",
                _schemaURL: "https://github.com/OpenLineage/OpenLineage/blob/v1-0-0/spec/OpenLineage.json#/definitions/SchemaDatasetFacet",
                fields: [
                  { name: a, type: INTEGER },
                  { name: b, type: TIMESTAMP },
                  { name: c, type: INTEGER },
                  { name: d, type: INTEGER }
                ]
              }
            }
          }
        ]
        producer: "https://github.com/OpenLineage/OpenLineage/blob/v1-0-0/client"

    SearchResultList:
      type: object
      properties:
        totalCount:
          description: Total number of search results.
          type: integer
          example: 1
        results:
          type: array
          items:
            $ref: '#/components/schemas/SearchResult'

    SearchResult:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/SearchResultType'
        name:
          type:
          description: The name of the dataset or job.
          example: public.delivery_7_days
        updatedAt:
          type:
          description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the date/time the dataset or job was updated.
          example: 2019-05-09T19:49:24.201361Z
        namespace:
          type: string
          description: The namespace of the dataset or job.
          example: food_delivery
        nodeId:
          type: string
          description: The ID of the node. A node can either be a dataset node or a job node. The format of
            nodeId for dataset is `dataset:<namespace_of_dataset>:<name_of_the_dataset>` and for job is
            `job:<namespace_of_the_job>:<name_of_the_job>`.
          example: 'dataset:food_delivery:public.delivery_7_days'

    SearchResultType:
      type: string
      enum: [DATASET, JOB]
      description: The type of search result.
      example: DATASET

    FacetsResult:
      type: object
      properties:
        runId:
          description: The ID associated with the run modifying the table.
          type: string
        facets:
          $ref: '#/components/schemas/CustomFacet'

    InputDatasetVersion:
      type: object
      properties:
        datasetVersionId:
          $ref: '#/components/schemas/DatasetVersionId'
        facets:
          type: object
          additionalProperties:
            type: string
          description: Dataset facets in run context, like `inputFacets`.
      required:
        - datasetVersionId
        - facets

    OutputDatasetVersion:
      type: object
      properties:
        datasetVersionId:
          $ref: '#/components/schemas/DatasetVersionId'
        facets:
          type: object
          additionalProperties:
            type: string
          description: Dataset facets in run context, like `outputFacets`.
      required:
        - datasetVersionId
        - facets
