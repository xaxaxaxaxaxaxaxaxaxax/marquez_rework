# SPDX-License-Identifier: Apache-2.0

openapi: 3.0.2
info:
  title: Marquez
  version: 0.51.2-SNAPSHOT
  description: Marquez is an open source **metadata service** for the **collection**, **aggregation**,
    and **visualization** of a data ecosystem's metadata.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:5000/api/v1
    description: Local API server
paths:
  /namespaces/{namespace}:
    parameters:
      - $ref: '#/components/parameters/namespace'
    put:
      operationId: putNamespace
      summary: Create a namespace
      description: Creates a new namespace object. A namespace enables the contextual grouping of related
        jobs and datasets. Namespaces must contain only letters (`a-z`, `A-Z`), numbers (`0-9`),
        underscores (`_`), dashes (`-`), colons (`:`), slashes (`/`), or dots (`.`).
        A namespace is case-insensitive with a maximum length of `1024` characters.
        Note jobs and datasets will be unique within a namespace, but not across namespaces.
      tags:
        - Namespaces
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatedNamespace'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
    get:
      operationId: getNamespace
      summary: Retrieve a namespace
      description: Returns a namespace.
      tags:
        - Namespaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'
    delete:
      operationId: deleteNamespace
      summary: Deletes a namespace
      description: Soft deletes a namespace, and every job and dataset inside. On next event containing this namespace, the namespace will be undeleted.
      tags:
        - Namespaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Namespace'

  /namespaces:
    get:
      operationId: getNamespaces
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all namespaces
      description: Returns a list of namespaces.
      tags:
        - Namespaces
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NamespaceList'

  /events/lineage:
    get:
      operationId: getLineageEvents
      parameters:
        - $ref: '#/components/parameters/sortDirection'
        - $ref: '#/components/parameters/before'
        - $ref: '#/components/parameters/after'
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all received OpenLineage events.
      description: Returns a list of OpenLineage events, sorted in direction of passed sort parameter. By default it is desc.
      tags:
        - Events
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageEventList'

  /sources/{source}:
    parameters:
      - $ref: '#/components/parameters/source'
    put:
      operationId: putSource
      summary: Create a source
      description: Creates a new source object. A source is the physical location of a dataset such as
        a table in PostgreSQL, or topic in Kafka. A source enables the grouping of physical datasets
        to their physical source.
      deprecated: true
      tags:
        - Sources
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatedSource'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
    get:
      operationId: getSource
      summary: Retrieve a source
      description: Returns a source.
      tags:
        - Sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'

  /sources:
    get:
      operationId: getSources
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all sources
      description: Returns a list of sources.
      tags:
        - Sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceList'

  /namespaces/{namespace}/datasets/{dataset}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/dataset'
    put:
      operationId: putDataset
      summary: Create a dataset
      description: Creates a new dataset.
      deprecated: true
      tags:
        - Datasets
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/DbTable'
                - $ref: '#/components/schemas/Stream'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
    get:
      operationId: getDataset
      summary: Retrieve a dataset
      description: Returns a dataset.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'
    delete:
      operationId: deleteDataset
      summary: Soft deletes dataset.
      description: Soft deletes dataset. It will be un-deleted if new OpenLineage event containing this dataset comes.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'

  /namespaces/{namespace}/datasets/{dataset}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/dataset'
      - $ref: '#/components/parameters/version'
    get:
      operationId: getDatasetVersion
      summary: Retrieve a version for a dataset
      description: Returns a version for a dataset.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersion'

  /namespaces/{namespace}/datasets/{dataset}/versions:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/dataset'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
    get:
      operationId: getDatasetVersions
      summary: List all versions for a dataset
      description: Returns a list of versions for a dataset.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetVersionList'

  /namespaces/{namespace}/datasets:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/dataset'
    get:
      operationId: getDatasets
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all datasets
      description: Returns a list of datasets.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetList'

  /namespaces/{namespace}/datasets/{dataset}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/dataset'
      - $ref: '#/components/parameters/tag'
    post:
      operationId: addTagToDataset
      summary: Tag a dataset
      description: Tag an existing dataset.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'

  /namespaces/{namespace}/datasets/{dataset}/fields/{field}/tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/dataset'
      - $ref: '#/components/parameters/field'
      - $ref: '#/components/parameters/tag'
    post:
      operationId: addTagToFieldOfDataset
      summary: Tag a field
      description: Tag an existing field of a dataset.
      tags:
        - Datasets
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dataset'

  /namespaces/{namespace}/jobs/{job}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/job'
    put:
      operationId: putJob
      summary: Create a job
      description: Creates a new job object. All job objects are immutable and are uniquely identified by a generated ID.
        Marquez will create a version of a job each time the contents of the object is modified. For example, the `location`
        of a job may change over time resulting in new versions. The accumulated versions can be listed, used to rerun a
        specific job version or possibly help debug a failed job run.
      deprecated: true
      tags:
        - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatedJob'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    get:
      operationId: getJob
      summary: Retrieve a job
      description: Retrieve a job.
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
    delete:
      operationId: deleteJob
      summary: Soft deletes job.
      description: Soft deletes job. It will be un-deleted if new OpenLineage event containing this job comes.
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'

  /namespaces/{namespace}/jobs:
    parameters:
      - $ref: '#/components/parameters/namespace'
    get:
      operationId: getJobs
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all jobs
      description: Returns a list of jobs.
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobList'

  /namespaces/{namespace}/jobs/{job}/versions/{version}:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/job'
      - $ref: '#/components/parameters/version'
    get:
      operationId: getJobVersion
      summary: Retrieve a version for a job
      description: Returns a version for a job.
      tags:
        - Jobs
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobVersion'

  /namespaces/{namespace}/jobs/{job}/versions:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/job'
    get:
      operationId: getJobVersions
      summary: List all versions for a job
      description: Returns a list of versions for a job.
      tags:
        - Jobs
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobVersionList'

  /namespaces/{namespace}/jobs/{job}/runs:
    parameters:
      - $ref: '#/components/parameters/namespace'
      - $ref: '#/components/parameters/job'
    post:
      operationId: createRun
      summary: Create a run
      description: Creates a new run object for a job.
      deprecated: true
      tags:
        - Jobs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatedRun'
      responses:
        '201':
          description: CREATED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'
    get:
      operationId: getRuns
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all runs
      description: Returns a list of runs for a job.
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'

  /jobs/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/runId'
    get:
      operationId: getRun
      summary: Retrieve a run
      description: Retrieve a run.
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'

  /jobs/runs/{id}/facets:
    parameters:
      - $ref: '#/components/parameters/runId'
      - $ref: '#/components/parameters/type'
    get:
      operationId: getFacets
      summary: Retrieve run or job facets for a run.
      description: Retrieve run or job facets for a run.
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacetsResult'

  /jobs/runs/{id}/start:
    parameters:
      - $ref: '#/components/parameters/runId'
      - $ref: '#/components/parameters/at'
    post:
      operationId: startRun
      summary: Start a run
      description: Marks the run as `RUNNING`.
      deprecated: true
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncompleteRun'

  /jobs/runs/{id}/complete:
    parameters:
      - $ref: '#/components/parameters/runId'
      - $ref: '#/components/parameters/at'
    post:
      operationId: completeRun
      summary: Complete a run
      description: Marks the run as `COMPLETED`.
      deprecated: true
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Run'

  /jobs/runs/{id}/fail:
    parameters:
      - $ref: '#/components/parameters/runId'
      - $ref: '#/components/parameters/at'
    post:
      operationId: failRun
      summary: Fail a run
      description: Marks the run as `FAILED`.
      deprecated: true
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncompleteRun'

  /jobs/runs/{id}/abort:
    parameters:
      - $ref: '#/components/parameters/runId'
      - $ref: '#/components/parameters/at'
    post:
      operationId: abortRun
      summary: Abort a run
      description: Marks the run as `ABORTED`.
      deprecated: true
      tags:
        - Jobs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncompleteRun'

  /lineage:
    post:
      operationId: recordLineage
      summary: Record a single lineage event
      description: >-
        Receive and commit a single lineage event to a durable database-backed intake queue using the
        [OpenLineage](https://github.com/OpenLineage/OpenLineage/blob/main/spec/OpenLineage.json) standard.
        Derived lineage projections are processed asynchronously and may not be visible immediately.
        There is no application-level event-count cap; database capacity applies. Acceptance confirms
        only that the event was committed to the intake queue. The queue retries database projection
        failures and can ultimately dead-letter an event after repeated failures. Search indexing and
        run-transition listener delivery happen after the queue item is acknowledged and are best
        effort: they have no durable delivery guarantee, may be missing, concurrent, or out of order,
        and are not retried by the intake queue. Any 5xx response during queue admission is
        commit-indeterminate: the queue transaction may already have committed even if Marquez did
        not observe the commit result. Clients that retry must tolerate duplicate events.
      tags:
        - Lineage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenLineageEventRequest'
      responses:
        '201':
          description: Empty response confirming only that the lineage event was committed to the durable intake queue
        '400':
          description: Malformed lineage event JSON, invalid input dataset identifier, or a text value containing U+0000
        '422':
          description: Lineage event failed request validation
        '500':
          description: >-
            Queue admission failed or its commit outcome is indeterminate; the lineage event may
            already have been committed, and a retry can submit a duplicate
    get:
      operationId: getLineage
      parameters:
        - $ref: '#/components/parameters/nodeId'
        - $ref: '#/components/parameters/depth'
      tags:
        - Lineage
      summary: Get a lineage graph
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageGraph'

  /lineage/batch:
    post:
      operationId: recordLineageBatch
      summary: Record a batch of lineage events
      description: >-
        Receive and atomically commit a batch of events to a durable database-backed intake queue
        using the [OpenLineage](https://github.com/OpenLineage/OpenLineage/blob/main/spec/OpenLineage.json)
        standard. The batch must contain between 1 and 1000 events. All events are validated and
        prepared before queue admission. Admission is atomic: the whole batch is committed in one
        queue transaction or none of it is committed; a batch is never partially admitted. A 204
        response confirms only that the entire batch was committed to the intake queue. Derived
        lineage projections are processed asynchronously and may not be visible immediately. The
        queue retries database projection failures and can ultimately dead-letter an event after
        repeated failures. Search indexing and run-transition listener delivery happen after a queue
        item is acknowledged and are best effort: they have no durable delivery guarantee, may be
        missing, concurrent, or out of order, and are not retried by the intake queue. Any 5xx
        response during queue admission is commit-indeterminate: the entire queue transaction may
        already have committed even if Marquez did not observe the commit result. Clients that retry
        must tolerate duplicate events for every event in the batch.
      tags:
        - Lineage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minItems: 1
              maxItems: 1000
              items:
                $ref: '#/components/schemas/OpenLineageEventRequest'
      responses:
        '204':
          description: No-content response confirming only that the entire batch was atomically committed to the durable intake queue
        '400':
          description: Malformed lineage batch JSON, invalid input dataset identifier, or a text value containing U+0000; no events were admitted
        '422':
          description: Batch is empty, contains more than 1000 events, contains a null item, or contains an event that failed request validation; no events were admitted
        '500':
          description: >-
            Queue admission failed or its commit outcome is indeterminate; the atomic transaction
            may already have committed the entire batch, and a retry can duplicate every event

  /runlineage/upstream:
    get:
      operationId: getRunLineageUpstream
      paramteters:
        - $ref: '#/components/parameters/runId'
        - $ref: '#/components/parameters/depth'
      tags:
        - Lineage
      summary: Get the upstream lineage for a given run
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpstreamRunLineage'

  /column-lineage:
    get:
      operationId: getColumnLineage
      parameters:
        - $ref: '#/components/parameters/nodeId'
        - $ref: '#/components/parameters/depth'
        - $ref: '#/components/parameters/withDownstream'
      tags:
        - Column lineage
      summary: Get a column lineage graph
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineageGraph'

  /tags/{tag}:
    parameters:
      - $ref: '#/components/parameters/tag'
    put:
      operationId: putTag
      summary: Create a tag
      description: Creates a new tag object.
      tags:
        - Tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatedTag'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'

  /tags:
    get:
      operationId: getTags
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/offset'
      summary: List all tags
      description: Returns a list of tags.
      tags:
        - Tags
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'

  /stats/query:
    get:
      operationId: queryStats
      summary: Query a native metric time series
      description: >-
        Returns one bounded, dense metric series in ascending interval order. Intervals use
        half-open `[startAt, endAt)` semantics and fixed elapsed-time rollups anchored at
        `startAt`; the final interval is clipped to `endAt`. `endAt` defaults to the current server
        time, `startAt` defaults to 24 hours before `endAt`, `scope` defaults to `GLOBAL`, and
        `rollup` defaults to `PT1H`. Rollups must be ISO-8601 durations between `PT1M` and `P30D`.
        Durations must have whole-millisecond precision, and timestamps must have whole-microsecond
        precision. The requested range must not exceed 366 elapsed days or 1000 buckets. `GLOBAL`
        accepts no selector, `NAMESPACE` requires `namespace`,
        `JOB` requires `namespace` and `jobName`, and `RUN` requires `runId`; selectors not used by
        the selected scope are rejected. Lineage-event metrics support every scope, job and dataset
        totals support `GLOBAL` and `NAMESPACE`, and source totals support only `GLOBAL`.
        Lineage-event buckets use the producer-reported `event_time`; `NAMESPACE` and `JOB` match
        exact, case-sensitive reported identities, while `RUN` matches the stored `run_uuid`. Only
        committed raw events are visible; queue admission alone does not count. Duplicate submissions
        count independently, late arrivals can revise earlier buckets, and retention can make old
        ranges indistinguishable from zero. Each
        asset-total bucket is a cumulative count of currently retained physical rows with
        `created_at < bucket end`, including hidden, deleted, or symlink rows; deletion and
        visibility history is not reconstructed. Buckets have no timezone or calendar-day
        semantics.
      tags:
        - Stats
      parameters:
        - name: metric
          in: query
          description: The native metric to query.
          required: true
          schema:
            $ref: '#/components/schemas/StatsMetric'
        - name: scope
          in: query
          description: The exact scope in which to evaluate the metric.
          required: false
          schema:
            allOf:
              - $ref: '#/components/schemas/StatsScope'
            default: GLOBAL
        - name: namespace
          in: query
          description: The exact namespace for `NAMESPACE` or `JOB` scope.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: jobName
          in: query
          description: The exact job name for `JOB` scope.
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 1024
        - name: runId
          in: query
          description: The stored Marquez run ID for `RUN` scope.
          required: false
          schema:
            type: string
            format: uuid
        - name: startAt
          in: query
          description: Inclusive range start. Defaults to 24 hours before the effective `endAt`.
          required: false
          schema:
            type: string
            format: date-time
        - name: endAt
          in: query
          description: Exclusive range end. Defaults to the current server time.
          required: false
          schema:
            type: string
            format: date-time
        - name: rollup
          in: query
          description: >-
            Fixed elapsed-time ISO-8601 duration between `PT1M` and `P30D`, inclusive. Values are
            canonicalized in the response.
          required: false
          schema:
            type: string
            default: PT1H
            example: PT15M
      responses:
        '200':
          description: A canonical, bounded metric series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsQueryResult'
        '400':
          description: Invalid metric, scope, selector, timestamp, rollup, range, or bucket count.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsError'
        '500':
          description: The metric query failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsError'

  /search:
    get:
      operationId: search
      parameters:
        - $ref: '#/components/parameters/q'
        - $ref: '#/components/parameters/filter'
        - $ref: '#/components/parameters/sort'
        - $ref: '#/components/parameters/limit'
        - name: namespace
          in: query
          description: Match jobs or datasets within the given namespace.
          required: false
          schema:
           type: string
           maxLength: 1024
           example: my-namespace
        - before:
          name: before
          in: query
          description: Match jobs or datasets **before** `YYYY-MM-DD`.
          required: false
          schema:
            type: string
            pattern: YYYY-MM-DD
            example: "2022-09-15"
        - after:
          name: after
          in: query
          description: Match jobs or datasets **after** `YYYY-MM-DD`.
          required: false
          schema:
            type: string
            pattern: YYYY-MM-DD
            example: "2022-09-15"

      summary: Query all datasets and jobs
      description: Returns one or more datasets and jobs of your query.
      tags:
        - Search
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultList'

components:
  parameters:
    at:
      name: at
      in: query
      description: An [ISO-8601](https://en.wikipedia.org/wiki/ISO_8601) timestamp representing the time when the run transitioned.
      required: false
      schema:
        type: string
        format: date-time

    namespace:
      name: namespace
      in: path
      description: The name of the namespace.
      required: true
      schema:
        type: string
        maxLength: 1024
        example: my-namespace

    source:
      name: source
      in: path
      description: The name of the source.
      required: true
      schema:
        type: string
        maxLength: 1024
        example: my-source

    dataset:
      name: dataset
      in: path
      description: The name of the dataset.
      required: true
      schema:
        type: string
        maxLength: 1024
        example: my-dataset

    tag:
      name: tag
      in: path
      description: The name of the tag.
      required: true
      schema:
        type: string
        example: SENSITIVE

    field:
      name: field
      in: path
      description: The name of the field.
      required: true
      schema:
        type: string
        example: my_field

    job:
      name: job
      in: path
      description: The name of the job.
      required: true
      schema:
        type: string
        maxLength: 1024
        example: my-job

    runId:
      name: id
      in: path
      description: The ID of the run.
      required: true
      schema:
        type: string
        format: uuid
        example: ea9badc5-7cb2-49af-9a9f-155771d3a797

    version:
      name: version
      in: path
      description: The ID of the job or dataset version.
      required: true
      schema:
        type: string
        format: uuid
        example: ea9badc5-7cb2-49af-9a9f-155771d3a797

    limit:
      name: limit
      in: query
      description: The number of results to return from offset.
      required: false
      schema:
        type: integer
        example: 25
        default: 100

    offset:
      name: offset
      in: query
      description: The initial position from which to return results.
      required: false
      schema:
        type: integer
        default: 0

    nodeId:
      name: nodeId
      in: query
      schema:
        type: string
        example: dataset:food_delivery:public.delivery_7_days
      description: The ID of the node. A node can either be a dataset node, a dataset field node or a job node.
        The format of nodeId for dataset is `dataset:<namespace_of_dataset>:<name_of_the_dataset>`, for dataset field
        is `datasetField:<namespace_of_dataset>:<name_of_the_dataset>:<name_of_field>`, and for job is
        `job:<namespace_of_the_job>:<name_of_the_job>`.
      required: true

    depth:
      name: depth
      in: query
      schema:
        type: integer
        default: 20
      description: Depth of lineage graph to create.
      required: false

    withDownstream:
      name: withDownstream
      in: query
      schema:
        type: boolean
        default: false
      description: Determines if downstream lineage should be returned.
      required: false

    q:
      name: q
      in: query
      schema:
        type: string
        example: my-dataset
        description: Query containing pattern to match; datasets and jobs pattern matching is string based
          and case-insensitive. Use percent sign (`%`) to match any string of zero or more characters (`my-job%`),
          or an underscore (`_`) to match a single character (`_job_`).
      required: true

    filter:
      name: filter
      in: query
      schema:
        type: string
        example: dataset
        description: Filters the results of your query by `dataset` or `job`.
      required: false

    sort:
      name: sort
      in: query
      schema:
        type: string
        example: name
        description: Sorts the results of your query by `name` or `updated_at`.
      required: false

    sortDirection:
      name: sortDirection
      in: query
      schema:
        type: string
        example: name
        description: Sorts the results of your query by indicated direction `asc` or `desc`.
      required: false

    before:
      name: before
      in: query
      description: Returns events before passed date.
      required: false
      schema:
        type: string
        format: date-time
        example: 2022-09-15T07:47:19Z

    after:
      name: after
      in: query
      description: Returns events after passed date.
      required: false
      schema:
        type: string
        format: date-time
        example: 2022-09-15T07:47:19Z

    type:
      name: type
      in: query
      description: Indicates if should return job or run facets.
      required: true
      schema:
        type: string
        enum:
          - run
          - job

